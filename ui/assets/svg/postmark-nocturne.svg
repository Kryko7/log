<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Celestial nocturne observatory ink postmark">
  <g fill="none" stroke="#3F4D63" opacity="0.88">
    <!-- Outer observatory double ring -->
    <circle cx="120" cy="120" r="102" stroke-width="2.3" stroke-dasharray="155 2.5 120 2 180 2" />
    <circle cx="120" cy="120" r="95" stroke-width="1.0" />
    <circle cx="120" cy="120" r="68" stroke-width="1.25" />
    <circle cx="120" cy="120" r="63" stroke-width="0.7" stroke-dasharray="2.5 3" />

    <!-- Cardinal degree markers -->
    <g stroke-width="1.1">
      <line x1="120" y1="25" x2="120" y2="33" />
      <line x1="120" y1="207" x2="120" y2="215" />
      <line x1="25" y1="120" x2="33" y2="120" />
      <line x1="207" y1="120" x2="215" y2="120" />
      <line x1="53" y1="53" x2="59" y2="59" />
      <line x1="187" y1="53" x2="181" y2="59" />
      <line x1="53" y1="187" x2="59" y2="181" />
      <line x1="187" y1="187" x2="181" y2="181" />
    </g>

    <!-- Engraved observatory headers -->
    <text x="120" y="47" fill="#3F4D63" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="2.8">NOCTURNE</text>
    <text x="120" y="200" fill="#3F4D63" stroke="none" font-family="'Courier New', monospace" font-size="7.8" font-weight="bold" text-anchor="middle" letter-spacing="2.2">FIELD NOTES</text>

    <!-- Lunar phase miniatures along left and right rim -->
    <circle cx="42" cy="120" r="5" fill="#3F4D63" fill-opacity="0.22" stroke-width="1.1" />
    <circle cx="198" cy="120" r="5" fill="#3F4D63" fill-opacity="0.22" stroke-width="1.1" />
    <path d="M42,115 A5,5 0 0,1 42,125 Z" fill="#3F4D63" stroke="none" />
    <path d="M198,115 A5,5 0 0,0 198,125 Z" fill="#3F4D63" stroke="none" />

    <!-- Central engraved crescent moon & 8-point celestial star -->
    <path d="M116,74 C95,78 82,97 85,118 C88,139 107,154 128,151 C141,149 151,142 157,131 C146,136 132,135 122,126 C109,115 107,95 116,74 Z"
          fill="#3F4D63" fill-opacity="0.18" stroke-width="1.8" stroke-linejoin="round" />

    <!-- 8-point star beside crescent -->
    <path d="M144,86 L146.5,95.5 L156,98 L146.5,100.5 L144,110 L141.5,100.5 L132,98 L141.5,95.5 Z"
          fill="#3F4D63" fill-opacity="0.72" stroke-width="0.9" />
    <line x1="137" y1="91" x2="151" y2="105" stroke-width="0.8" />
    <line x1="151" y1="91" x2="137" y2="105" stroke-width="0.8" />

    <!-- Tiny constellation dots & connecting hairlines -->
    <g stroke-width="0.65" opacity="0.7">
      <line x1="100" y1="142" x2="120" y2="158" />
      <line x1="120" y1="158" x2="146" y2="148" />
    </g>
    <circle cx="100" cy="142" r="1.6" fill="#3F4D63" stroke="none" />
    <circle cx="120" cy="158" r="1.8" fill="#3F4D63" stroke="none" />
    <circle cx="146" cy="148" r="1.5" fill="#3F4D63" stroke="none" />
    <circle cx="131" cy="80" r="1.3" fill="#3F4D63" stroke="none" />
    <circle cx="156" cy="116" r="1.2" fill="#3F4D63" stroke="none" />
  </g>
</svg>
