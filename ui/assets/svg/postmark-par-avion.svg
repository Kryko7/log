<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 156" width="300" height="156" role="img" aria-label="Par Avion special dispatch airmail ink stamp">
  <g fill="none" stroke="#546E5A" opacity="0.88">
    <!-- Outer vintage dispatch frame with double corner rules -->
    <rect x="10" y="10" width="280" height="136" rx="6" stroke-width="2.4" stroke-dasharray="190 2 140 2 220 2" />
    <rect x="18" y="18" width="264" height="120" rx="3" stroke-width="1.05" />

    <!-- Diagonal airmail stripes in left and right margins -->
    <g stroke="#B5563E" stroke-width="2.2" opacity="0.65">
      <line x1="26" y1="30" x2="40" y2="18" />
      <line x1="26" y1="44" x2="54" y2="18" />
      <line x1="246" y1="138" x2="274" y2="112" />
      <line x1="260" y1="138" x2="274" y2="125" />
    </g>

    <!-- Horizontal dividers -->
    <line x1="34" y1="54" x2="266" y2="54" stroke-width="1.1" />
    <line x1="34" y1="104" x2="266" y2="104" stroke-width="1.1" />

    <!-- Top engraved winged quill emblem & subtitle -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M126,37 C134,30 144,29 150,35 C156,29 166,30 174,37" stroke-width="1.4" />
      <path d="M132,41 C138,37 145,37 150,41 C155,37 162,37 168,41" stroke-width="1.0" />
      <line x1="150" y1="26" x2="150" y2="46" stroke-width="1.2" />
    </g>
    <text x="74" y="40" fill="#546E5A" stroke="none" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1.6">BY AIR</text>
    <text x="226" y="40" fill="#546E5A" stroke="none" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1.6">NO. 019</text>

    <!-- Bold serif center stamp -->
    <text x="150" y="88" fill="#B5563E" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" text-anchor="middle" letter-spacing="4.2">PAR AVION</text>

    <!-- Footer dispatch line -->
    <text x="150" y="124" fill="#546E5A" stroke="none" font-family="'Courier New', monospace" font-size="8.8" font-weight="bold" text-anchor="middle" letter-spacing="2.4">SPECIAL DISPATCH • LOG POST</text>
  </g>
</svg>
