<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Morning pages espresso studio ink stamp">
  <g fill="none" stroke="#7A5A42" opacity="0.84">
    <!-- Organic espresso cup ring stain outer impressions -->
    <circle cx="120" cy="120" r="92" stroke-width="4.2" opacity="0.32" stroke-dasharray="110 8 75 5 150 6 120 9" />
    <circle cx="122" cy="118" r="88" stroke-width="1.8" opacity="0.52" stroke-dasharray="80 4 140 6 160 5" />
    <circle cx="118" cy="122" r="95" stroke-width="1.1" opacity="0.28" stroke-dasharray="45 12 95 7 130 10" />

    <!-- Subtle tiny espresso droplet flecks -->
    <circle cx="204" cy="76" r="3.1" fill="#7A5A42" fill-opacity="0.34" stroke="none" />
    <circle cx="211" cy="84" r="1.6" fill="#7A5A42" fill-opacity="0.28" stroke="none" />
    <circle cx="44" cy="166" r="2.4" fill="#7A5A42" fill-opacity="0.3" stroke="none" />

    <!-- Crisp studio rubber stamp nestled inside ring -->
    <circle cx="120" cy="120" r="64" stroke-width="1.7" />
    <circle cx="120" cy="120" r="58" stroke-width="0.8" stroke-dasharray="2.5 2.5" />
    <line x1="72" y1="104" x2="168" y2="104" stroke-width="1.0" />
    <line x1="72" y1="136" x2="168" y2="136" stroke-width="1.0" />

    <!-- Rising steam icon -->
    <path d="M111,94 C109,89 113,86 111,81" stroke-width="1.2" stroke-linecap="round" />
    <path d="M120,96 C118,90 122,86 120,80" stroke-width="1.2" stroke-linecap="round" />
    <path d="M129,94 C127,89 131,86 129,81" stroke-width="1.2" stroke-linecap="round" />

    <!-- Typography -->
    <text x="120" y="124" fill="#6D4F39" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="1.8">MORNING PAGES</text>
    <text x="120" y="152" fill="#6D4F39" stroke="none" font-family="'Courier New', monospace" font-size="7.6" font-weight="bold" text-anchor="middle" letter-spacing="1.9">BREWED FRESH</text>
  </g>
</svg>
