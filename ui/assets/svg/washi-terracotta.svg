<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 92" width="360" height="92" role="img" aria-label="Semi-translucent terracotta and sage watercolor washi tape">
  <defs>
    <!-- Deckle-torn left and right paper edges -->
    <clipPath id="washiTerraClip">
      <path d="M 12,11 L 58,12.5 L 114,10.5 L 172,12 L 228,10.5 L 288,12 L 346,11 L 351,17 L 344,23 L 352,29 L 345,35 L 353,42 L 346,48 L 351,55 L 343,61 L 350,68 L 344,74 L 347,80 L 295,79.5 L 236,81 L 178,79.5 L 118,81 L 60,79.5 L 13,80.5 L 9,74 L 16,67 L 8,60 L 15,54 L 9,47 L 17,40 L 10,33 L 16,26 L 10,19 Z" />
    </clipPath>

    <!-- Warm terracotta blending into muted botanical sage wash -->
    <linearGradient id="terraSageGrad" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#B85D43" stop-opacity="0.80" />
      <stop offset="32%" stop-color="#C8755A" stop-opacity="0.74" />
      <stop offset="62%" stop-color="#9A7E6B" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#5E7A64" stop-opacity="0.78" />
    </linearGradient>

    <radialGradient id="watercolorBloom1" cx="28%" cy="45%" r="36%">
      <stop offset="0%" stop-color="#D47458" stop-opacity="0.48" />
      <stop offset="70%" stop-color="#B85D43" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#B85D43" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="watercolorBloom2" cx="76%" cy="52%" r="34%">
      <stop offset="0%" stop-color="#5E7A64" stop-opacity="0.50" />
      <stop offset="75%" stop-color="#4A6450" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#5E7A64" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Subtle drop shadow underneath tape -->
  <path d="M 14,13.5 L 348,13.5 L 345,82.5 L 13,82.5 Z" fill="#2A2421" opacity="0.10" />

  <g clip-path="url(#washiTerraClip)">
    <!-- Cream kozo underlayer + watercolor washes -->
    <rect x="0" y="0" width="360" height="92" fill="#FBF5EB" fill-opacity="0.45" />
    <rect x="0" y="0" width="360" height="92" fill="url(#terraSageGrad)" />
    <rect x="0" y="0" width="360" height="92" fill="url(#watercolorBloom1)" />
    <rect x="0" y="0" width="360" height="92" fill="url(#watercolorBloom2)" />

    <!-- Organic watercolor tide-lines & pigment edges -->
    <path d="M 45,10 C 78,34 118,22 156,48 C 192,72 238,54 275,78" fill="none" stroke="#9B452E" stroke-width="1.2" opacity="0.28" />
    <path d="M 160,12 C 196,28 228,18 265,42 C 296,62 325,45 352,65" fill="none" stroke="#455E4B" stroke-width="1.1" opacity="0.30" />

    <!-- Delicate cream-ink botanical sprigs across the watercolor wash -->
    <g fill="none" stroke="#FBF7F0" stroke-linecap="round" stroke-linejoin="round" opacity="0.62">
      <path d="M 52,68 C 66,52 82,38 98,25" stroke-width="1.2" />
      <path d="M 65,55 C 62,47 64,41 69,38 C 70,45 69,50 65,55 Z" fill="#FBF7F0" fill-opacity="0.45" stroke-width="0.8" />
      <path d="M 74,47 C 82,49 88,47 92,42 C 85,41 79,43 74,47 Z" fill="#FBF7F0" fill-opacity="0.45" stroke-width="0.8" />
      <path d="M 85,36 C 83,29 86,23 91,20 C 92,27 90,32 85,36 Z" fill="#FBF7F0" fill-opacity="0.45" stroke-width="0.8" />

      <path d="M 172,22 C 184,38 196,54 208,68" stroke-width="1.15" />
      <path d="M 181,35 C 189,33 195,35 198,40 C 192,41 186,39 181,35 Z" fill="#FBF7F0" fill-opacity="0.40" stroke-width="0.8" />
      <path d="M 190,46 C 183,50 180,56 181,62 C 187,58 190,52 190,46 Z" fill="#FBF7F0" fill-opacity="0.40" stroke-width="0.8" />

      <path d="M 270,66 C 284,52 298,38 314,24" stroke-width="1.2" />
      <path d="M 284,52 C 282,44 285,38 290,36 C 291,43 288,48 284,52 Z" fill="#FBF7F0" fill-opacity="0.45" stroke-width="0.8" />
      <path d="M 296,41 C 304,43 310,41 313,36 C 306,35 301,37 296,41 Z" fill="#FBF7F0" fill-opacity="0.45" stroke-width="0.8" />
      <circle cx="136" cy="48" r="1.4" fill="#FBF7F0" stroke="none" />
      <circle cx="238" cy="34" r="1.3" fill="#FBF7F0" stroke="none" />
    </g>

    <!-- Fine torn white paper fiber edge along left & right -->
    <path d="M 12,11 L 10,19 L 16,26 L 10,33 L 17,40 L 9,47 L 15,54 L 8,60 L 16,67 L 9,74 L 13,80.5" fill="none" stroke="#FBF7F0" stroke-width="2.2" opacity="0.55" />
    <path d="M 346,11 L 351,17 L 344,23 L 352,29 L 345,35 L 353,42 L 346,48 L 351,55 L 343,61 L 350,68 L 344,74 L 347,80" fill="none" stroke="#FBF7F0" stroke-width="2.2" opacity="0.55" />
  </g>
</svg>
