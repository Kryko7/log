<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Animated evening coastal tide watercolor cover">
  <defs>
    <linearGradient id="coastSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F1E6" />
      <stop offset="52%" stop-color="#EAECE6" />
      <stop offset="100%" stop-color="#D4DFDB" />
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7D794" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#D99B52" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#D99B52" stop-opacity="0" />
    </radialGradient>
    <style>
      .wave-a { animation: tideA 9s ease-in-out infinite; }
      .wave-b { animation: tideB 11.5s ease-in-out -3s infinite; }
      .wave-c { animation: tideA 13s ease-in-out -6s infinite; }
      .beacon { transform-origin: 296px 214px; animation: beaconPulse 4.6s ease-in-out infinite; }
      .oat-sway { transform-origin: 800px 395px; animation: oatWind 7.2s ease-in-out infinite; }
      .gull-glide { animation: gullDrift 16s ease-in-out infinite; }
      @keyframes tideA {
        0%, 100% { transform: translateX(-16px); }
        50% { transform: translateX(18px); }
      }
      @keyframes tideB {
        0%, 100% { transform: translateX(18px); }
        50% { transform: translateX(-16px); }
      }
      @keyframes beaconPulse {
        0%, 100% { transform: scale(0.75); opacity: 0.35; }
        50% { transform: scale(1.25); opacity: 0.95; }
      }
      @keyframes oatWind {
        0%, 100% { transform: rotate(-2.2deg); }
        50% { transform: rotate(2.5deg); }
      }
      @keyframes gullDrift {
        0%, 100% { transform: translate(-22px, 4px); }
        50% { transform: translate(26px, -10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-a, .wave-b, .wave-c, .beacon, .oat-sway, .gull-glide { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#coastSky)" />

  <!-- Misty distant headland & tiny lighthouse silhouette -->
  <path d="M0,264 Q140,224 272,246 Q355,258 435,274 L0,274 Z" fill="#8DA096" opacity="0.52" />
  <path d="M0,264 Q140,224 272,246 Q355,258 435,274" fill="none" stroke="#546E5A" stroke-width="1.1" opacity="0.55" />

  <!-- Lighthouse tower -->
  <g fill="#4B433D" opacity="0.82">
    <path d="M292,246 L294,218 L298,218 L300,246 Z" />
    <rect x="292.5" y="213" width="7" height="5" />
    <path d="M291.5,213 L296,208 L300.5,213 Z" />
  </g>
  <g class="beacon">
    <circle cx="296" cy="214" r="34" fill="url(#beaconGlow)" />
    <circle cx="296" cy="214" r="2.6" fill="#FFF7DE" />
  </g>

  <!-- Minimalist distant gull -->
  <g class="gull-glide" fill="none" stroke="#6D6157" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
    <path d="M565,204 Q574,195 583,203 Q592,195 601,204" />
    <path d="M618,192 Q625,186 632,191 Q639,186 646,192" stroke-width="1.0" />
  </g>

  <!-- Layered rhythmic watercolor tide bands -->
  <path class="wave-a" d="M-40,274 Q120,266 280,274 T600,274 T1000,274 L1000,540 L-40,540 Z" fill="#A9BCB6" opacity="0.45" />
  <path class="wave-b" d="M-40,302 Q150,292 330,304 T690,300 T1000,306 L1000,540 L-40,540 Z" fill="#8BA49D" opacity="0.38" />
  <path class="wave-c" d="M-40,334 Q180,322 390,336 T760,332 T1000,338 L1000,540 L-40,540 Z" fill="#6D887F" opacity="0.32" />

  <!-- Subtle ink shoreline ripple strokes -->
  <g class="wave-b" fill="none" stroke="#FBF7F0" stroke-width="1.3" stroke-linecap="round" opacity="0.58">
    <path d="M120,294 Q175,290 230,294" />
    <path d="M440,318 Q510,314 580,318" />
    <path d="M690,290 Q745,287 800,290" />
  </g>

  <!-- Warm sandy dune & swaying foreground sea oats -->
  <path d="M560,412 Q730,352 960,370 L960,540 L520,540 Z" fill="#DFCEB4" opacity="0.72" />
  <g class="oat-sway" fill="none" stroke="#6E5942" stroke-linecap="round" opacity="0.7">
    <path d="M770,405 Q782,340 818,284" stroke-width="1.5" />
    <path d="M808,408 Q825,332 868,274" stroke-width="1.6" />
    <path d="M846,406 Q860,348 898,298" stroke-width="1.4" />
    <ellipse cx="814" cy="292" rx="8" ry="3.2" fill="#C9A265" transform="rotate(-35 814 292)" />
    <ellipse cx="823" cy="280" rx="7" ry="2.8" fill="#C9A265" transform="rotate(-30 823 280)" />
    <ellipse cx="862" cy="284" rx="8.5" ry="3.2" fill="#C9A265" transform="rotate(-38 862 284)" />
    <ellipse cx="872" cy="272" rx="7" ry="2.8" fill="#C9A265" transform="rotate(-32 872 272)" />
    <ellipse cx="894" cy="304" rx="7.5" ry="3" fill="#C9A265" transform="rotate(-34 894 304)" />
  </g>
</svg>
