<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Animated botanical ink and watercolor wash cover">
  <defs>
    <linearGradient id="kozoBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0" />
      <stop offset="50%" stop-color="#F5EDE0" />
      <stop offset="100%" stop-color="#EFE5D4" />
    </linearGradient>
    <radialGradient id="sageBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#546E5A" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#6E8A74" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#546E5A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="terraBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B5563E" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#C8755C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#B5563E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ochreBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D99B52" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#E4B574" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#D99B52" stop-opacity="0" />
    </radialGradient>
    <style>
      .wash-1 { transform-origin: 270px 265px; animation: breatheA 12s ease-in-out infinite; }
      .wash-2 { transform-origin: 540px 255px; animation: breatheB 14.5s ease-in-out -3s infinite; }
      .wash-3 { transform-origin: 735px 280px; animation: breatheA 13.2s ease-in-out -6.5s infinite; }
      .mote-a { animation: moteFloat 9s ease-in-out infinite; }
      .mote-b { animation: moteFloat 11.4s ease-in-out -4.2s infinite; }
      @keyframes breatheA {
        0%, 100% { transform: scale(0.95) translate(0px, 0px); opacity: 0.78; }
        50% { transform: scale(1.08) translate(16px, -8px); opacity: 1; }
      }
      @keyframes breatheB {
        0%, 100% { transform: scale(1.05) translate(0px, 0px); opacity: 0.92; }
        50% { transform: scale(0.94) translate(-18px, 10px); opacity: 0.74; }
      }
      @keyframes moteFloat {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.35; }
        50% { transform: translate(12px, -14px); opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .wash-1, .wash-2, .wash-3, .mote-a, .mote-b { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#kozoBase)" />

  <!-- Breathing watercolor pigment clouds -->
  <ellipse class="wash-1" cx="270" cy="265" rx="250" ry="155" fill="url(#sageBloom)" />
  <ellipse class="wash-2" cx="540" cy="255" rx="260" ry="165" fill="url(#ochreBloom)" />
  <ellipse class="wash-3" cx="735" cy="280" rx="230" ry="150" fill="url(#terraBloom)" />

  <!-- Fine fountain-pen botanical ink linework over the living wash -->
  <g fill="none" stroke="#3A312C" stroke-linecap="round" opacity="0.48">
    <path d="M165,332 C245,288 338,248 446,232 C548,217 652,240 764,218" stroke-width="1.35" />
    <path d="M268,282 C255,256 266,232 288,225 C292,248 286,268 268,282 Z" fill="#546E5A" fill-opacity="0.16" stroke-width="1.0" />
    <path d="M352,250 C368,274 394,284 416,276 C402,256 378,246 352,250 Z" fill="#D99B52" fill-opacity="0.18" stroke-width="1.0" />
    <path d="M495,228 C482,202 496,178 518,174 C522,196 512,216 495,228 Z" fill="#546E5A" fill-opacity="0.16" stroke-width="1.0" />
    <path d="M618,233 C634,258 660,268 682,258 C668,238 644,228 618,233 Z" fill="#B5563E" fill-opacity="0.16" stroke-width="1.0" />
    <path d="M715,224 C724,202 742,190 762,192 C754,210 736,222 715,224 Z" fill="#D99B52" fill-opacity="0.18" stroke-width="0.95" />
  </g>

  <!-- Subtle gold-leaf dust motes -->
  <g fill="#C99245">
    <circle class="mote-a" cx="235" cy="222" r="2.2" />
    <circle class="mote-b" cx="430" cy="296" r="1.8" />
    <circle class="mote-a" cx="566" cy="204" r="2.4" />
    <circle class="mote-b" cx="690" cy="292" r="1.9" />
    <circle class="mote-a" cx="808" cy="242" r="2.1" />
  </g>
</svg>
