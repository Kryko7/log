<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Animated candlelit firefly nocturnal garden cover">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141315" />
      <stop offset="55%" stop-color="#1C1A1B" />
      <stop offset="100%" stop-color="#221E1C" />
    </linearGradient>
    <radialGradient id="amberHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7D28B" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#D99B52" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D99B52" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="76%" cy="35%" r="28%">
      <stop offset="0%" stop-color="#E8C98F" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D99B52" stop-opacity="0" />
    </radialGradient>
    <style>
      .ff-a { animation: floatA 8.5s ease-in-out infinite, glowPulse 4.2s ease-in-out infinite; }
      .ff-b { animation: floatB 10.2s ease-in-out -2.4s infinite, glowPulse 5.1s ease-in-out -1.5s infinite; }
      .ff-c { animation: floatA 9.4s ease-in-out -5.1s infinite, glowPulse 3.9s ease-in-out -2.8s infinite; }
      .ff-d { animation: floatB 11.6s ease-in-out -4.0s infinite, glowPulse 4.8s ease-in-out -0.9s infinite; }
      .star-twinkle { animation: twinkle 6.5s ease-in-out infinite; }
      .star-twinkle-2 { animation: twinkle 7.8s ease-in-out -3.2s infinite; }
      .fern-l { transform-origin: 140px 440px; animation: fernSway 9s ease-in-out infinite; }
      .fern-r { transform-origin: 830px 440px; animation: fernSway 10.5s ease-in-out -3.5s infinite; }
      @keyframes floatA {
        0%, 100% { transform: translate(0px, 0px); }
        33% { transform: translate(18px, -14px); }
        66% { transform: translate(-12px, -24px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0px, 0px); }
        40% { transform: translate(-20px, -16px); }
        75% { transform: translate(14px, -8px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
      }
      @keyframes fernSway {
        0%, 100% { transform: rotate(-1.5deg); }
        50% { transform: rotate(2deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ff-a, .ff-b, .ff-c, .ff-d, .star-twinkle, .star-twinkle-2, .fern-l, .fern-r {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#nightSky)" />
  <rect width="960" height="540" fill="url(#moonGlow)" />

  <!-- Subtle distant starlight -->
  <g fill="#EBE2D5">
    <circle class="star-twinkle" cx="148" cy="185" r="1.4" />
    <circle class="star-twinkle-2" cx="264" cy="158" r="1.1" />
    <circle class="star-twinkle" cx="412" cy="172" r="1.5" />
    <circle class="star-twinkle-2" cx="556" cy="148" r="1.2" />
    <circle class="star-twinkle" cx="645" cy="192" r="1.3" />
    <circle class="star-twinkle-2" cx="842" cy="170" r="1.4" />
  </g>

  <!-- Engraved gilded crescent moon -->
  <path d="M742,188 C716,193 700,217 705,242 C710,267 735,283 760,278 C773,275 784,267 790,255 C777,261 761,259 749,249 C734,236 732,212 742,188 Z"
        fill="#E6C386" fill-opacity="0.82" stroke="#D99B52" stroke-width="1.2" />

  <!-- Gentle silhouetted nocturnal hills & botanical ferns -->
  <path d="M0,378 Q210,330 430,364 T960,348 L960,540 L0,540 Z" fill="#181F1A" opacity="0.88" />

  <g class="fern-l" fill="none" stroke="#4D6352" stroke-linecap="round" opacity="0.72">
    <path d="M90,420 C115,355 150,295 204,244" stroke-width="2" />
    <path d="M126,350 C106,332 95,316 98,302 C112,312 124,328 130,346" fill="#2E3D32" stroke-width="1.1" />
    <path d="M144,322 C168,325 186,320 198,308 C182,302 164,306 146,318" fill="#2E3D32" stroke-width="1.1" />
    <path d="M162,292 C145,274 138,258 144,246 C156,256 164,272 166,289" fill="#2E3D32" stroke-width="1.0" />
    <path d="M178,270 C198,272 212,266 222,256 C208,252 194,256 180,266" fill="#2E3D32" stroke-width="1.0" />
  </g>

  <g class="fern-r" fill="none" stroke="#4D6352" stroke-linecap="round" opacity="0.68">
    <path d="M875,420 C848,355 812,300 762,254" stroke-width="2" />
    <path d="M840,352 C860,334 872,318 868,304 C854,314 842,330 836,348" fill="#2E3D32" stroke-width="1.1" />
    <path d="M820,324 C796,328 778,322 766,310 C782,304 800,308 818,320" fill="#2E3D32" stroke-width="1.1" />
    <path d="M800,295 C818,278 824,262 818,250 C806,260 798,276 796,292" fill="#2E3D32" stroke-width="1.0" />
  </g>

  <!-- Floating candlelit amber fireflies -->
  <g class="ff-a"><circle cx="220" cy="272" r="22" fill="url(#amberHalo)" /><circle cx="220" cy="272" r="2.6" fill="#FFF3D4" /></g>
  <g class="ff-b"><circle cx="338" cy="238" r="18" fill="url(#amberHalo)" /><circle cx="338" cy="238" r="2.2" fill="#FFF3D4" /></g>
  <g class="ff-c"><circle cx="468" cy="296" r="24" fill="url(#amberHalo)" /><circle cx="468" cy="296" r="2.8" fill="#FFF3D4" /></g>
  <g class="ff-d"><circle cx="584" cy="252" r="20" fill="url(#amberHalo)" /><circle cx="584" cy="252" r="2.4" fill="#FFF3D4" /></g>
  <g class="ff-a"><circle cx="662" cy="306" r="17" fill="url(#amberHalo)" /><circle cx="662" cy="306" r="2.0" fill="#FFF3D4" /></g>
  <g class="ff-c"><circle cx="288" cy="322" r="15" fill="url(#amberHalo)" /><circle cx="288" cy="322" r="1.9" fill="#FFF3D4" /></g>
  <g class="ff-b"><circle cx="512" cy="212" r="16" fill="url(#amberHalo)" /><circle cx="512" cy="212" r="2.0" fill="#FFF3D4" /></g>
  <g class="ff-d"><circle cx="775" cy="316" r="21" fill="url(#amberHalo)" /><circle cx="775" cy="316" r="2.5" fill="#FFF3D4" /></g>
</svg>
