<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Animated morning tea steam and golden sunbeams cover">
  <defs>
    <linearGradient id="morningWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF5E8" />
      <stop offset="55%" stop-color="#F4E7D1" />
      <stop offset="100%" stop-color="#E9D6B9" />
    </linearGradient>
    <linearGradient id="sunShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7DE" stop-opacity="0.62" />
      <stop offset="55%" stop-color="#EBC47D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D99B52" stop-opacity="0" />
    </linearGradient>
    <style>
      .beam-breathe { animation: beamPulse 10s ease-in-out infinite; }
      .steam-1 { animation: steamRise 6.2s ease-in-out infinite; }
      .steam-2 { animation: steamRise 7.6s ease-in-out -2.8s infinite; }
      .steam-3 { animation: steamRise 6.8s ease-in-out -4.6s infinite; }
      .dust-a { animation: dustFloat 10.5s ease-in-out infinite; }
      .dust-b { animation: dustFloat 12.8s ease-in-out -4.5s infinite; }
      @keyframes beamPulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes steamRise {
        0% { transform: translate(0px, 14px) scale(0.9); opacity: 0; }
        25% { opacity: 0.56; }
        70% { opacity: 0.36; }
        100% { transform: translate(10px, -42px) scale(1.12); opacity: 0; }
      }
      @keyframes dustFloat {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.3; }
        50% { transform: translate(16px, -12px); opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .beam-breathe, .steam-1, .steam-2, .steam-3, .dust-a, .dust-b { animation: none !important; opacity: 0.55 !important; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#morningWall)" />

  <!-- Slanting golden morning sunbeams -->
  <g class="beam-breathe">
    <polygon points="80,0 320,0 640,540 360,540" fill="url(#sunShaft)" />
    <polygon points="370,0 530,0 850,540 660,540" fill="url(#sunShaft)" opacity="0.72" />
  </g>

  <!-- Subtle wooden study tabletop horizon -->
  <rect x="0" y="340" width="960" height="200" fill="#DFC9AA" opacity="0.58" />
  <line x1="0" y1="340" x2="960" y2="340" stroke="#9B7E5E" stroke-width="1.2" opacity="0.45" />

  <!-- Hand-sketched terracotta teacup & linen saucer -->
  <g transform="translate(495, 290)">
    <ellipse cx="0" cy="64" rx="84" ry="15" fill="#B5563E" fill-opacity="0.2" stroke="#6B4433" stroke-width="1.3" />
    <path d="M-48,14 C-46,52 -24,62 0,62 C24,62 46,52 48,14 Z" fill="#C46B50" fill-opacity="0.78" stroke="#5A3327" stroke-width="1.5" />
    <ellipse cx="0" cy="14" rx="48" ry="10" fill="#8B5A3C" fill-opacity="0.75" stroke="#5A3327" stroke-width="1.4" />
    <path d="M47,22 C66,22 68,46 42,48" fill="none" stroke="#5A3327" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Gently curling translucent tea steam ribbons -->
  <g fill="none" stroke="#FBF7F0" stroke-linecap="round">
    <path class="steam-1" d="M482,292 C472,268 492,250 482,226 C474,208 486,192 480,176" stroke-width="4.5" />
    <path class="steam-2" d="M498,296 C510,270 490,248 504,222 C514,202 498,186 508,168" stroke-width="5.2" />
    <path class="steam-3" d="M514,292 C522,272 508,256 518,236 C524,220 516,204 522,190" stroke-width="3.6" />
  </g>

  <!-- Floating golden sunbeam dust motes -->
  <g fill="#FFF7DE">
    <circle class="dust-a" cx="275" cy="215" r="2.2" />
    <circle class="dust-b" cx="352" cy="268" r="1.8" />
    <circle class="dust-a" cx="420" cy="198" r="2.5" />
    <circle class="dust-b" cx="585" cy="232" r="2.0" />
    <circle class="dust-a" cx="655" cy="285" r="1.7" />
    <circle class="dust-b" cx="315" cy="306" r="1.9" />
  </g>
</svg>
