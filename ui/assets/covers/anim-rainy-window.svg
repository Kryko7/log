<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Animated rainy garden window watercolor cover">
  <defs>
    <linearGradient id="rainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE3DC" />
      <stop offset="52%" stop-color="#EBF0E8" />
      <stop offset="100%" stop-color="#D3DDD2" />
    </linearGradient>
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0" stop-opacity="0.34" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#546E5A" stop-opacity="0.14" />
    </linearGradient>
    <radialGradient id="mistWash" cx="52%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FBF7F0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#546E5A" stop-opacity="0" />
    </radialGradient>
    <style>
      .rain-layer-a { animation: rainFallA 3.8s linear infinite; }
      .rain-layer-b { animation: rainFallB 5.4s linear infinite; }
      .drop-1 { animation: dropSlide 7.5s ease-in infinite; }
      .drop-2 { animation: dropSlide 9.2s ease-in -3.1s infinite; }
      .drop-3 { animation: dropSlide 6.8s ease-in -5.0s infinite; }
      .drop-4 { animation: dropSlide 8.4s ease-in -1.6s infinite; }
      .drop-5 { animation: dropSlide 10.2s ease-in -6.4s infinite; }
      .bough-sway { transform-origin: 820px 140px; animation: gentleSway 8.5s ease-in-out infinite; }
      .bough-sway-l { transform-origin: 120px 160px; animation: gentleSway 10.2s ease-in-out -3s infinite; }
      @keyframes rainFallA {
        0% { transform: translate(24px, -110px); opacity: 0.7; }
        100% { transform: translate(-24px, 110px); opacity: 0.7; }
      }
      @keyframes rainFallB {
        0% { transform: translate(18px, -120px); opacity: 0.45; }
        100% { transform: translate(-18px, 120px); opacity: 0.45; }
      }
      @keyframes dropSlide {
        0% { transform: translateY(-28px) scale(0.85); opacity: 0; }
        12% { opacity: 0.75; }
        82% { opacity: 0.65; }
        100% { transform: translateY(155px) scale(1.05); opacity: 0; }
      }
      @keyframes gentleSway {
        0%, 100% { transform: rotate(-1.4deg); }
        50% { transform: rotate(1.8deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rain-layer-a, .rain-layer-b, .drop-1, .drop-2, .drop-3, .drop-4, .drop-5, .bough-sway, .bough-sway-l {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#rainSky)" />
  <rect width="960" height="540" fill="url(#mistWash)" />

  <!-- Soft misty garden hills & watercolor foliage outside the glass -->
  <path d="M0,360 Q180,295 360,335 T740,318 T960,342 L960,540 L0,540 Z" fill="#8FA392" opacity="0.34" />
  <path d="M0,395 Q240,340 490,378 T960,362 L960,540 L0,540 Z" fill="#67806D" opacity="0.32" />

  <g class="bough-sway-l" opacity="0.45" fill="#546E5A" stroke="#3F5644" stroke-width="1.2">
    <path d="M-10,205 C65,190 140,215 215,248" fill="none" stroke-width="2" />
    <ellipse cx="75" cy="196" rx="22" ry="9" transform="rotate(-18 75 196)" />
    <ellipse cx="122" cy="215" rx="25" ry="9.5" transform="rotate(14 122 215)" />
    <ellipse cx="168" cy="224" rx="22" ry="8.5" transform="rotate(-12 168 224)" />
    <ellipse cx="198" cy="245" rx="19" ry="7.5" transform="rotate(22 198 245)" />
  </g>

  <g class="bough-sway" opacity="0.42" fill="#546E5A" stroke="#3F5644" stroke-width="1.2">
    <path d="M975,185 C890,175 815,205 742,244" fill="none" stroke-width="2" />
    <ellipse cx="892" cy="184" rx="24" ry="9" transform="rotate(16 892 184)" />
    <ellipse cx="842" cy="202" rx="26" ry="9.5" transform="rotate(-15 842 202)" />
    <ellipse cx="792" cy="218" rx="23" ry="8.5" transform="rotate(12 792 218)" />
    <ellipse cx="758" cy="240" rx="19" ry="7.5" transform="rotate(-18 758 240)" />
  </g>

  <!-- Diagonal falling rain streaks -->
  <g class="rain-layer-a" stroke="#546E5A" stroke-linecap="round" stroke-width="1.1" opacity="0.34">
    <line x1="90" y1="70" x2="72" y2="142" /><line x1="175" y1="120" x2="155" y2="198" />
    <line x1="265" y1="60" x2="246" y2="136" /><line x1="355" y1="150" x2="336" y2="232" />
    <line x1="445" y1="85" x2="426" y2="165" /><line x1="538" y1="135" x2="520" y2="215" />
    <line x1="628" y1="75" x2="610" y2="152" /><line x1="718" y1="145" x2="700" y2="225" />
    <line x1="812" y1="80" x2="794" y2="160" /><line x1="895" y1="128" x2="877" y2="208" />
    <line x1="130" y1="255" x2="112" y2="335" /><line x1="295" y1="275" x2="277" y2="355" />
    <line x1="485" y1="265" x2="467" y2="345" /><line x1="665" y1="280" x2="647" y2="360" />
    <line x1="845" y1="255" x2="827" y2="335" />
  </g>

  <g class="rain-layer-b" stroke="#6D6157" stroke-linecap="round" stroke-width="0.85" opacity="0.24">
    <line x1="140" y1="90" x2="126" y2="152" /><line x1="228" y1="170" x2="214" y2="232" />
    <line x1="395" y1="115" x2="381" y2="177" /><line x1="582" y1="165" x2="568" y2="227" />
    <line x1="762" y1="110" x2="748" y2="172" /><line x1="922" y1="175" x2="908" y2="237" />
    <line x1="210" y1="310" x2="196" y2="372" /><line x1="420" y1="305" x2="406" y2="367" />
    <line x1="612" y1="318" x2="598" y2="380" /><line x1="795" y1="300" x2="781" y2="362" />
  </g>

  <!-- Soft translucent droplets sliding on windowpane -->
  <g fill="#FBF7F0" stroke="#546E5A" stroke-opacity="0.35" stroke-width="0.9">
    <g class="drop-1"><path d="M214,180 C214,180 220,192 220,196 A6,6 0 1,1 208,196 C208,192 214,180 214,180 Z" fill-opacity="0.58" /></g>
    <g class="drop-2"><path d="M412,162 C412,162 419,176 419,181 A7,7 0 1,1 405,181 C405,176 412,162 412,162 Z" fill-opacity="0.52" /></g>
    <g class="drop-3"><path d="M598,176 C598,176 603,187 603,191 A5,5 0 1,1 593,191 C593,187 598,176 598,176 Z" fill-opacity="0.6" /></g>
    <g class="drop-4"><path d="M746,168 C746,168 752,181 752,186 A6,6 0 1,1 740,186 C740,181 746,168 746,168 Z" fill-opacity="0.54" /></g>
    <g class="drop-5"><path d="M324,195 C324,195 329,205 329,209 A5,5 0 1,1 319,209 C319,205 324,195 324,195 Z" fill-opacity="0.48" /></g>
  </g>

  <!-- Glass sheen -->
  <rect width="960" height="540" fill="url(#glassTint)" />

  <!-- Subtle architectural walnut window mullions -->
  <g fill="#4B4039" opacity="0.22">
    <rect x="316" y="0" width="8" height="540" />
    <rect x="636" y="0" width="8" height="540" />
    <rect x="0" y="268" width="960" height="7" />
  </g>
  <g fill="#FBF7F0" opacity="0.26">
    <rect x="324" y="0" width="2" height="540" />
    <rect x="644" y="0" width="2" height="540" />
    <rect x="0" y="275" width="960" height="2" />
  </g>
</svg>
