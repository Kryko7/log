<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Animated drifting autumn botanical leaves cover">
  <defs>
    <linearGradient id="autumnPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EC" />
      <stop offset="55%" stop-color="#F6ECDC" />
      <stop offset="100%" stop-color="#EFE1CA" />
    </linearGradient>
    <radialGradient id="warmWashA" cx="24%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#D99B52" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D99B52" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warmWashB" cx="76%" cy="54%" r="38%">
      <stop offset="0%" stop-color="#B5563E" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#B5563E" stop-opacity="0" />
    </radialGradient>
    <style>
      .leaf-1 { animation: driftA 13s ease-in-out infinite; }
      .leaf-2 { animation: driftB 15s ease-in-out -4s infinite; }
      .leaf-3 { animation: driftA 11.5s ease-in-out -7.2s infinite; }
      .leaf-4 { animation: driftB 14.2s ease-in-out -2.1s infinite; }
      .leaf-5 { animation: driftA 16.5s ease-in-out -9.5s infinite; }
      .leaf-6 { animation: driftB 12.8s ease-in-out -5.8s infinite; }
      @keyframes driftA {
        0% { transform: translate(-45px, -85px) rotate(-18deg); opacity: 0; }
        12% { opacity: 0.92; }
        50% { transform: translate(35px, 18px) rotate(14deg); opacity: 0.95; }
        88% { opacity: 0.85; }
        100% { transform: translate(95px, 120px) rotate(-10deg); opacity: 0; }
      }
      @keyframes driftB {
        0% { transform: translate(55px, -95px) rotate(22deg); opacity: 0; }
        14% { opacity: 0.88; }
        52% { transform: translate(-25px, 24px) rotate(-12deg); opacity: 0.92; }
        86% { opacity: 0.8; }
        100% { transform: translate(-80px, 130px) rotate(16deg); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .leaf-1, .leaf-2, .leaf-3, .leaf-4, .leaf-5, .leaf-6 { animation: none !important; opacity: 0.9 !important; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#autumnPaper)" />
  <rect width="960" height="540" fill="url(#warmWashA)" />
  <rect width="960" height="540" fill="url(#warmWashB)" />

  <!-- Fine archival ink corner botanical twigs -->
  <g fill="none" stroke="#6D5847" stroke-width="1.2" opacity="0.45" stroke-linecap="round">
    <path d="M-10,210 C55,205 110,224 156,255" />
    <path d="M62,212 C74,195 92,188 106,192 C98,205 82,212 62,212 Z" fill="#D99B52" fill-opacity="0.24" />
    <path d="M96,222 C112,235 124,248 122,262 C108,255 98,240 96,222 Z" fill="#B5563E" fill-opacity="0.22" />
    <path d="M970,320 C902,310 848,288 802,256" />
    <path d="M890,304 C878,285 862,276 846,280 C856,294 872,302 890,304 Z" fill="#546E5A" fill-opacity="0.2" />
  </g>

  <!-- Gently drifting watercolor maple & ginkgo leaves -->
  <g class="leaf-1" transform="translate(210, 240)">
    <path d="M0,-28 L7,-10 L26,-16 L14,-1 L28,11 L10,11 L12,24 L0,14 L-12,24 L-10,11 L-28,11 L-14,-1 L-26,-16 L-7,-10 Z"
          fill="#B5563E" fill-opacity="0.72" stroke="#5A3327" stroke-width="1.1" />
    <line x1="0" y1="14" x2="0" y2="33" stroke="#5A3327" stroke-width="1.2" />
  </g>

  <g class="leaf-2" transform="translate(390, 225)">
    <path d="M0,18 C-16,4 -30,-10 -22,-22 C-12,-28 -3,-22 0,-12 C3,-22 12,-28 22,-22 C30,-10 16,4 0,18 Z"
          fill="#D99B52" fill-opacity="0.74" stroke="#6E4B23" stroke-width="1.1" />
    <line x1="0" y1="18" x2="0" y2="32" stroke="#6E4B23" stroke-width="1.1" />
  </g>

  <g class="leaf-3" transform="translate(565, 252)">
    <path d="M0,-24 L6,-8 L22,-13 L12,-1 L24,9 L9,9 L10,20 L0,12 L-10,20 L-9,9 L-24,9 L-12,-1 L-22,-13 L-6,-8 Z"
          fill="#C47448" fill-opacity="0.7" stroke="#5E3824" stroke-width="1.05" />
    <line x1="0" y1="12" x2="0" y2="28" stroke="#5E3824" stroke-width="1.1" />
  </g>

  <g class="leaf-4" transform="translate(725, 232)">
    <path d="M0,16 C-14,3 -26,-9 -19,-19 C-10,-25 -3,-19 0,-10 C3,-19 10,-25 19,-19 C26,-9 14,3 0,16 Z"
          fill="#E0AE63" fill-opacity="0.72" stroke="#6E4B23" stroke-width="1.05" />
    <line x1="0" y1="16" x2="0" y2="29" stroke="#6E4B23" stroke-width="1.05" />
  </g>

  <g class="leaf-5" transform="translate(300, 286)">
    <path d="M-16,0 C-10,-14 6,-16 18,-6 C12,10 -4,14 -16,0 Z"
          fill="#6C7F69" fill-opacity="0.62" stroke="#3F503E" stroke-width="1.0" />
    <path d="M-16,0 Q0,-4 18,-6" fill="none" stroke="#3F503E" stroke-width="0.8" />
  </g>

  <g class="leaf-6" transform="translate(650, 290)">
    <path d="M-14,0 C-8,-12 6,-14 16,-4 C10,9 -4,12 -14,0 Z"
          fill="#B5563E" fill-opacity="0.58" stroke="#5A3327" stroke-width="1.0" />
    <path d="M-14,0 Q0,-3 16,-4" fill="none" stroke="#5A3327" stroke-width="0.75" />
  </g>
</svg>
