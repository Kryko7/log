name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ui-and-guardrails:
    name: UI Modules, IPC Parity & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify UI modules, icon keys, Tauri IPC parity, assets, and zero emojis
        run: node scripts/check-ui.mjs
      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

  rust-core:
    name: Rust Core Workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting (workspace + src-tauri)
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace

  tauri-desktop-linux:
    name: Tauri v2 Desktop (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK & Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Clippy src-tauri (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build Tauri release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
      - name: CLI end-to-end smoke test (seed-demo, age backup, restore)
        env:
          LOG_BACKUP_PASSPHRASE: ci-smoke-passphrase-2026
        run: |
          BIN="${CARGO_TARGET_DIR}/release/log-journal"
          VAULT_DIR="$(mktemp -d)"
          RESTORE_DIR="$(mktemp -d)"
          trap 'rm -rf "$VAULT_DIR" "$RESTORE_DIR"' EXIT

          "$BIN" --help
          "$BIN" --vault "$VAULT_DIR" seed-demo
          "$BIN" --vault "$VAULT_DIR" backup --passphrase-env LOG_BACKUP_PASSPHRASE
          BACKUP_FILE="$(ls -1t "$VAULT_DIR/backups"/*.tar.gz.age | head -n 1)"
          test -f "$BACKUP_FILE"
          "$BIN" --vault "$VAULT_DIR" restore --file "$BACKUP_FILE" --target "$RESTORE_DIR" --passphrase-env LOG_BACKUP_PASSPHRASE --overwrite
          test -d "$RESTORE_DIR/entries"
