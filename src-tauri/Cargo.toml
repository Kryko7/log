[package]
name = "log-desktop"
version = "0.1.0"
description = "Tauri v2 desktop wrapper for Log personal journal"
authors = ["Log Authors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
anyhow = "1.0"
dirs = "6.0"
journal-types = { path = "../crates/journal-types" }
journal-core = { path = "../crates/journal-core" }
journal-import = { path = "../crates/journal-import" }
journal-sync = { path = "../crates/journal-sync" }
