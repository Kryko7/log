[package]
name = "log-desktop"
version = "0.1.0"
description = "Desktop wrapper for Log personal journal"
authors = ["Log Authors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
journal-types = { path = "../crates/journal-types" }
journal-core = { path = "../crates/journal-core" }
journal-sync = { path = "../crates/journal-sync" }
