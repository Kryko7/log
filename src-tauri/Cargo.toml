[package]
name = "log-desktop"
version = "0.1.0"
description = "Pure Tauri v2 desktop application for Log personal journal"
authors = ["Log Authors"]
license = "MIT"
edition = "2021"

[[bin]]
name = "log-journal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
anyhow = "1.0"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hound = "3.5"
journal-types = { path = "../crates/journal-types" }
journal-core = { path = "../crates/journal-core" }
journal-import = { path = "../crates/journal-import" }
journal-sync = { path = "../crates/journal-sync" }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gdk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_8"] }
libc = "0.2"
