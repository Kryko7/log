[workspace]
resolver = "2"
members = [
    "crates/journal-types",
    "crates/journal-core",
    "crates/journal-import",
    "crates/journal-sync",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
journal-types = { path = "crates/journal-types" }
journal-core = { path = "crates/journal-core" }

# Serialization & Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
dirs = "6.0"
walkdir = "2.5"
regex = "1.11"

# Async & HTTP Client
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Storage, Markdown & Media
rusqlite = { version = "0.40", features = ["bundled"] }
pulldown-cmark = "0.13"
notify = "8.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
hound = "3.5"

# Import, Archives & Encryption
zip = { version = "9.0", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
age = { version = "0.11", features = ["armor"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false
