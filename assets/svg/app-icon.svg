<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Log Journal emblem: open stitched notebook with brass fountain-pen nib and pressed ginkgo leaf">
  <defs>
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF9F2" />
      <stop offset="100%" stop-color="#F2E9DA" />
    </linearGradient>
    <linearGradient id="linenCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C46A4F" />
      <stop offset="100%" stop-color="#9A4832" />
    </linearGradient>
    <linearGradient id="ginkgoWash" x1="15%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E7B75A" />
      <stop offset="55%" stop-color="#D4953A" />
      <stop offset="100%" stop-color="#B06C28" />
    </linearGradient>
    <linearGradient id="brassNib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D088" />
      <stop offset="48%" stop-color="#C89B45" />
      <stop offset="100%" stop-color="#8C6422" />
    </linearGradient>
    <linearGradient id="pageSpreadL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F2E6" />
      <stop offset="85%" stop-color="#FDFBF6" />
      <stop offset="100%" stop-color="#E8DEC9" />
    </linearGradient>
    <linearGradient id="pageSpreadR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DEC9" />
      <stop offset="15%" stop-color="#FDFBF6" />
      <stop offset="100%" stop-color="#F6EFE1" />
    </linearGradient>
  </defs>

  <!-- Cream parchment badge -->
  <rect x="10" y="10" width="236" height="236" rx="48" fill="url(#parchmentBg)" stroke="#D9CBB6" stroke-width="2.5" />
  <rect x="20" y="20" width="216" height="216" rx="40" fill="none" stroke="#C8B69D" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.75" />

  <!-- Subtle botanical sage corner sprigs -->
  <g fill="none" stroke="#5E7A64" stroke-width="1.4" opacity="0.65" stroke-linecap="round">
    <path d="M 38,54 C 42,42 50,36 60,34" />
    <path d="M 46,44 C 42,38 44,33 49,33 C 50,38 49,42 46,44 Z" fill="#5E7A64" fill-opacity="0.35" />
    <path d="M 218,202 C 214,214 206,220 196,222" />
    <path d="M 210,212 C 214,218 212,223 207,223 C 206,218 207,214 210,212 Z" fill="#5E7A64" fill-opacity="0.35" />
  </g>

  <!-- Open stitched linen notebook -->
  <g transform="translate(0, 4)">
    <!-- Soft shadow -->
    <rect x="34" y="64" width="188" height="128" rx="9" fill="#2A2421" opacity="0.11" />

    <!-- Terracotta linen binding cover -->
    <rect x="32" y="58" width="192" height="128" rx="8" fill="url(#linenCover)" stroke="#5A2B1E" stroke-width="1.8" />

    <!-- Stacked page thickness edges -->
    <path d="M 38,63 L 128,67 L 218,63 L 218,179 L 128,183 L 38,179 Z" fill="#E6DAC3" stroke="#7A6A58" stroke-width="1.1" />
    <path d="M 40,61 L 128,65 L 216,61 L 216,176 L 128,180 L 40,176 Z" fill="#EFE6D3" stroke="#8C7B68" stroke-width="0.9" />

    <!-- Open left & right parchment pages -->
    <path d="M 43,60 Q 85,56 128,64 L 128,176 Q 85,169 43,173 Z" fill="url(#pageSpreadL)" stroke="#5E4F43" stroke-width="1.3" />
    <path d="M 128,64 Q 171,56 213,60 L 213,173 Q 171,169 128,176 Z" fill="url(#pageSpreadR)" stroke="#5E4F43" stroke-width="1.3" />

    <!-- Center saddle-stitching thread loops -->
    <line x1="128" y1="64" x2="128" y2="176" stroke="#7B6B5C" stroke-width="1.1" />
    <g stroke="#B85D43" stroke-width="2.0" stroke-linecap="round">
      <line x1="128" y1="76" x2="128" y2="85" />
      <line x1="128" y1="98" x2="128" y2="107" />
      <line x1="128" y1="120" x2="128" y2="129" />
      <line x1="128" y1="142" x2="128" y2="151" />
      <line x1="128" y1="160" x2="128" y2="168" />
    </g>

    <!-- Faint ruled journal lines on pages -->
    <g stroke="#CBBCA5" stroke-width="0.9" opacity="0.65">
      <line x1="54" y1="80" x2="114" y2="82" />
      <line x1="54" y1="96" x2="114" y2="98" />
      <line x1="54" y1="112" x2="114" y2="114" />
      <line x1="54" y1="128" x2="114" y2="130" />
      <line x1="54" y1="144" x2="114" y2="146" />
      <line x1="142" y1="82" x2="200" y2="80" />
      <line x1="142" y1="98" x2="200" y2="96" />
      <line x1="142" y1="114" x2="200" y2="112" />
      <line x1="142" y1="130" x2="200" y2="128" />
    </g>
  </g>

  <!-- Pressed Ginkgo Leaf nestled on left page -->
  <g transform="translate(86, 114) rotate(-14)">
    <path d="M 0,24 C -10,12 -32,6 -36,-12 C -31,-20 -20,-24 -12,-28 C -5,-26 -2,-16 -1,-8 C 1,-16 5,-25 13,-27 C 22,-23 32,-17 36,-9 C 31,9 10,13 0,24 Z"
          fill="url(#ginkgoWash)" stroke="#4A3525" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Ginkgo stem -->
    <path d="M 0,24 C 1,35 3,45 5,52" fill="none" stroke="#4A3525" stroke-width="2.1" stroke-linecap="round" />
    <!-- Fine radiating ginkgo leaf veins -->
    <g stroke="#4A3525" stroke-width="0.7" opacity="0.7" stroke-linecap="round">
      <line x1="0" y1="22" x2="-24" y2="-10" />
      <line x1="0" y1="22" x2="-17" y2="-19" />
      <line x1="0" y1="22" x2="-8" y2="-22" />
      <line x1="0" y1="22" x2="8" y2="-21" />
      <line x1="0" y1="22" x2="18" y2="-17" />
      <line x1="0" y1="22" x2="26" y2="-8" />
    </g>
  </g>

  <!-- Brass Fountain-Pen Nib poised across the right page -->
  <g transform="translate(174, 112) rotate(36)">
    <!-- Drop shadow -->
    <path d="M -14,-44 L 14,-44 L 18,-10 L 0,48 L -18,-10 Z" fill="#2A2421" opacity="0.14" transform="translate(3,4)" />

    <!-- Walnut-ink & brass grip collar -->
    <rect x="-15" y="-62" width="30" height="18" rx="3" fill="#3B2B22" stroke="#241913" stroke-width="1.5" />
    <rect x="-16.5" y="-47" width="33" height="6" rx="1.5" fill="url(#brassNib)" stroke="#4A3525" stroke-width="1.2" />

    <!-- Engraved brass nib silhouette -->
    <path d="M -13,-41 L 13,-41 L 16,-14 L 19,-6 L 0,45 L -19,-6 L -16,-14 Z"
          fill="url(#brassNib)" stroke="#3D2B1E" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Nib slit & breather heart/circle -->
    <line x1="0" y1="3" x2="0" y2="44" stroke="#3D2B1E" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="0" cy="-1" r="3.4" fill="#3D2B1E" />

    <!-- Fine filigree engraving lines on nib shoulders -->
    <g fill="none" stroke="#5C4124" stroke-width="0.95" stroke-linecap="round" opacity="0.85">
      <path d="M -10,-32 C -8,-22 -12,-14 -7,-6" />
      <path d="M 10,-32 C 8,-22 12,-14 7,-6" />
      <path d="M -9,-19 Q 0,-25 9,-19" />
    </g>

    <!-- Warm terracotta/walnut ink droplet at tip -->
    <path d="M 0,49 C 3.5,54 3.5,58 0,58 C -3.5,58 -3.5,54 0,49 Z" fill="#B85D43" stroke="#5A2B1E" stroke-width="0.8" />
  </g>
</svg>
